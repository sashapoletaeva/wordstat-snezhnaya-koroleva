name: Wordstat dashboard
on:
  push:
    branches: [main]
    paths-ignore: [data.json]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: wordstat-pages
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh Wordstat
        id: refresh
        continue-on-error: true
        env:
          WORDSTAT_FOLDER_ID: ${{ secrets.WORDSTAT_FOLDER_ID }}
          WORDSTAT_API_KEY: ${{ secrets.WORDSTAT_API_KEY }}
        run: python3 update.py
      - name: Save data
        if: steps.refresh.outcome == 'success'
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Wordstat data'
            git push
          fi
      - run: |
          mkdir public
          cp index.html report.js public/
          if [ -f data.json ]; then cp data.json public/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Report refresh failure
        if: steps.refresh.outcome == 'failure'
        run: exit 1
